plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.google.services)
}

android {
    namespace 'com.bunzeeeeer.expenseiq'
    compileSdk 36

    defaultConfig {
        applicationId "com.bunzeeeeer.expenseiq"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Core modules
    implementation project(':core:core-domain')
    implementation project(':core:core-data')
    implementation project(':core:core-ui')

    // Feature modules
    implementation project(':feature:feature-dashboard')
    implementation project(':feature:feature-expense')
    implementation project(':feature:feature-charts')
    implementation project(':feature:feature-budget')
    implementation project(':feature:feature-auth')

    // UI
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Lifecycle
    implementation libs.lifecycle.viewmodel
    implementation libs.lifecycle.livedata

    // RxJava
    implementation libs.rxjava2
    implementation libs.rxandroid

    // Navigation
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // Firebase
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth

    // MPAndroidChart
    implementation libs.mpandroidchart

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}